<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate — Matrix LMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-100 min-h-screen">

<nav class="bg-slate-900 text-white no-print">
  <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="dashboard.html" class="font-bold text-lg tracking-tight">Matrix <span class="text-emerald-400">LMS</span></a>
    <div class="flex gap-2">
      <button id="printBtn" class="text-sm px-3 py-1.5 rounded-md bg-emerald-500 hover:bg-emerald-600">Print / Save PDF</button>
      <a href="dashboard.html" class="text-sm px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700">Dashboard</a>
    </div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-6 py-10">
  <div id="certWrap"></div>
</main>

<script type="module">
  import { api, requireAuth, escapeHtml, qs } from './js/api.js';

  requireAuth();
  const certId = qs('id');
  if (!certId) window.location.href = 'dashboard.html';

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  async function load() {
    const { certificate } = await api.getCertificate(certId);
    document.getElementById('certWrap').innerHTML = `
      <div class="certificate-sheet bg-white border-8 border-double border-emerald-600 rounded-2xl px-10 py-16 text-center shadow-lg">
        <div class="text-xs tracking-[0.3em] text-emerald-600 font-bold mb-3">CERTIFICATE OF COMPLETION</div>
        <div class="text-3xl font-serif font-bold text-slate-900 mb-6">Matrix Learning Management System</div>

        <div class="text-sm text-slate-500 mb-2">This certifies that</div>
        <div class="text-2xl font-bold text-slate-900 mb-6" style="font-family: Georgia, serif;">${escapeHtml(certificate.student_name)}</div>

        <div class="text-sm text-slate-500 mb-2">has successfully completed</div>
        <div class="text-xl font-semibold text-emerald-700 mb-8">${escapeHtml(certificate.course_title)}</div>

        <div class="flex justify-center gap-16 text-sm text-slate-600 mb-8">
          <div>
            <div class="font-semibold text-slate-900">${new Date(certificate.issued_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}</div>
            <div class="text-xs text-slate-400 mt-1">Date issued</div>
          </div>
          <div>
            <div class="font-semibold text-slate-900 font-mono">${escapeHtml(certificate.certificate_code)}</div>
            <div class="text-xs text-slate-400 mt-1">Certificate code</div>
          </div>
        </div>

        <div class="text-xs text-slate-400 border-t border-slate-100 pt-4">
          Anyone can verify this certificate's authenticity at
          <span class="font-mono">/api/certificates/verify/${escapeHtml(certificate.certificate_code)}</span> — no login required.
        </div>
      </div>
    `;
  }

  load().catch((err) => {
    document.getElementById('certWrap').innerHTML = `<p class="text-red-600 text-sm">Could not load certificate: ${escapeHtml(err.message)}</p>`;
  });
</script>
</body>
</html>
