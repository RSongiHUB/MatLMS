<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course — Matrix LMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<nav class="bg-slate-900 text-white no-print">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <a href="dashboard.html" class="font-bold text-lg tracking-tight">Matrix <span class="text-emerald-400">LMS</span></a>
    <div class="flex items-center gap-4 text-sm">
      <div class="w-40 hidden sm:block">
        <div class="h-1.5 rounded-full bg-slate-700 overflow-hidden"><div id="topProgressBar" class="h-full bg-emerald-500" style="width:0%"></div></div>
      </div>
      <span id="topProgressLabel" class="text-slate-300 text-xs"></span>
      <a href="dashboard.html" class="px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700">Dashboard</a>
    </div>
  </div>
</nav>

<div class="flex-1 flex max-w-7xl mx-auto w-full">
  <aside class="w-80 shrink-0 border-r border-slate-200 bg-white overflow-y-auto no-print" style="max-height: calc(100vh - 56px)">
    <div class="p-4 border-b border-slate-100">
      <h1 id="courseTitle" class="font-bold text-slate-900"></h1>
      <p id="courseMeta" class="text-xs text-slate-400 mt-1"></p>
    </div>
    <div id="manageBar" class="hidden p-3 border-b border-slate-100 bg-amber-50">
      <button id="addModuleBtn" class="w-full text-xs font-semibold bg-slate-900 hover:bg-slate-700 text-white rounded-md py-2">+ Add Module</button>
    </div>
    <nav id="moduleNav" class="p-2"></nav>
  </aside>

  <main class="flex-1 p-6 sm:p-8 overflow-y-auto" style="max-height: calc(100vh - 56px)">
    <div id="mainContent" class="max-w-2xl"></div>
  </main>
</div>

<!-- Add Module Modal -->
<div id="moduleModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4 no-print">
  <div class="bg-white rounded-xl w-full max-w-sm p-6 relative">
    <button data-close-modal class="absolute top-3 right-4 text-slate-400 hover:text-slate-700 text-xl">&times;</button>
    <h2 class="text-lg font-bold mb-4">New module</h2>
    <form id="moduleForm" class="space-y-3">
      <input type="text" id="moduleTitle" placeholder="e.g. Module 4: Charts & Dashboards" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
      <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-md py-2 text-sm">Add module</button>
    </form>
  </div>
</div>

<!-- Add Lesson Modal -->
<div id="lessonModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4 no-print">
  <div class="bg-white rounded-xl w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
    <button data-close-modal class="absolute top-3 right-4 text-slate-400 hover:text-slate-700 text-xl">&times;</button>
    <h2 class="text-lg font-bold mb-4">New lesson</h2>
    <form id="lessonForm" class="space-y-3">
      <input type="hidden" id="lessonModuleId">
      <input type="text" id="lessonTitle" placeholder="Lesson title" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
      <select id="lessonType" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
        <option value="video">Video</option>
        <option value="text">Text</option>
        <option value="assignment">Assignment</option>
        <option value="quiz">Quiz</option>
      </select>
      <div id="fieldVideoUrl">
        <label class="text-xs font-medium block mb-1">Video URL</label>
        <input type="text" id="lessonVideoUrl" placeholder="https://... (mp4 or embeddable link)" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-xs font-medium block mb-1" id="bodyLabel">Notes / body</label>
        <textarea id="lessonBody" rows="3" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></textarea>
      </div>
      <div id="fieldInstructions" class="hidden">
        <label class="text-xs font-medium block mb-1">Assignment instructions</label>
        <textarea id="lessonInstructions" rows="3" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></textarea>
      </div>
      <div id="fieldPassPercent" class="hidden">
        <label class="text-xs font-medium block mb-1">Quiz pass percent</label>
        <input type="number" id="lessonPassPercent" value="70" min="0" max="100" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
      </div>
      <input type="number" id="lessonDuration" placeholder="Duration (minutes)" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
      <p id="lessonError" class="text-sm text-red-600 hidden"></p>
      <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-md py-2 text-sm">Add lesson</button>
    </form>
  </div>
</div>

<script type="module">
  import { api, requireAuth, escapeHtml, qs } from './js/api.js';

  const user = requireAuth();
  const courseId = qs('course');
  const manageMode = qs('manage') === '1';
  if (!courseId) window.location.href = 'dashboard.html';

  let course = null;
  let currentLessonId = null;
  let isOwnerOrAdmin = false;

  const openModal = (el) => { el.classList.remove('hidden'); el.classList.add('flex'); };
  const closeModal = (el) => { el.classList.add('hidden'); el.classList.remove('flex'); };
  document.querySelectorAll('[data-close-modal]').forEach((b) => b.addEventListener('click', (e) => closeModal(e.target.closest('.fixed'))));

  function iconFor(type) { return type === 'video' ? '🎥' : type === 'quiz' ? '❓' : type === 'assignment' ? '📝' : '📄'; }

  function renderSidebar() {
    document.getElementById('courseTitle').textContent = course.title;
    document.getElementById('courseMeta').textContent = `by ${course.instructor_name || 'Unassigned'}${course.is_published ? '' : ' · Draft'}`;
    document.getElementById('manageBar').classList.toggle('hidden', !isOwnerOrAdmin || !manageMode);

    const nav = document.getElementById('moduleNav');
    nav.innerHTML = course.modules.map((m) => `
      <div class="mb-3">
        <div class="flex items-center justify-between px-2 py-1">
          <div class="text-xs font-bold uppercase tracking-wide text-slate-500">${escapeHtml(m.title)}</div>
          ${isOwnerOrAdmin && manageMode ? `<div class="flex gap-1">
            <button data-add-lesson="${m.id}" class="text-xs text-emerald-600 hover:underline">+ lesson</button>
            <button data-delete-module="${m.id}" class="text-xs text-red-500 hover:underline">delete</button>
          </div>` : ''}
        </div>
        ${m.lessons.map((l) => `
          <button data-lesson="${l.id}" class="w-full text-left flex items-center gap-2 px-2 py-2 rounded-md text-sm ${l.id === currentLessonId ? 'bg-emerald-50 text-emerald-800 font-semibold' : 'hover:bg-slate-50 text-slate-700'}">
            <span>${iconFor(l.content_type)}</span>
            <span class="flex-1 truncate">${escapeHtml(l.title)}</span>
            ${l.completed ? '<span class="text-emerald-500 text-xs">✓</span>' : ''}
            ${isOwnerOrAdmin && manageMode ? `<span data-delete-lesson="${l.id}" class="text-red-400 hover:text-red-600 text-xs" title="Delete">✕</span>` : ''}
          </button>
        `).join('')}
      </div>
    `).join('');

    nav.querySelectorAll('[data-lesson]').forEach((el) => el.addEventListener('click', (e) => {
      if (e.target.closest('[data-delete-lesson]')) return;
      selectLesson(el.dataset.lesson);
    }));
    nav.querySelectorAll('[data-add-lesson]').forEach((el) => el.addEventListener('click', () => openLessonModal(el.dataset.addLesson)));
    nav.querySelectorAll('[data-delete-module]').forEach((el) => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this module and all its lessons?')) return;
      await api.deleteModule(el.dataset.deleteModule);
      await loadCourse();
    }));
    nav.querySelectorAll('[data-delete-lesson]').forEach((el) => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this lesson?')) return;
      await api.deleteLesson(el.dataset.deleteLesson);
      await loadCourse();
    }));
  }

  function findLesson(lessonId) {
    for (const m of course.modules) {
      const l = m.lessons.find((x) => x.id === lessonId);
      if (l) return l;
    }
    return null;
  }

  async function refreshProgress() {
    try {
      const p = await api.courseProgress(courseId);
      document.getElementById('topProgressBar').style.width = `${p.percent}%`;
      document.getElementById('topProgressLabel').textContent = `${p.percent}% complete`;
    } catch (e) { /* not enrolled yet — fine, just skip */ }
  }

  async function selectLesson(lessonId) {
    currentLessonId = lessonId;
    renderSidebar();
    const lesson = findLesson(lessonId);
    const main = document.getElementById('mainContent');

    const header = `
      <div class="text-xs uppercase tracking-wide font-bold text-emerald-600 mb-1">${iconFor(lesson.content_type)} ${lesson.content_type}</div>
      <h2 class="text-2xl font-bold text-slate-900 mb-1">${escapeHtml(lesson.title)}</h2>
      <p class="text-sm text-slate-400 mb-6">${lesson.duration_minutes ? lesson.duration_minutes + ' min' : ''}</p>
    `;

    if (lesson.content_type === 'video') {
      main.innerHTML = header + `
        <div class="rounded-xl overflow-hidden bg-black mb-5">
          <video controls class="w-full" src="${escapeHtml(lesson.video_url || '')}"></video>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
          <h3 class="font-semibold mb-2 text-sm">Notes</h3>
          <p class="text-sm text-slate-600 whitespace-pre-line">${escapeHtml(lesson.body || 'No notes for this lesson.')}</p>
        </div>
        <button id="completeBtn" class="px-4 py-2 rounded-md text-sm font-semibold ${lesson.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-emerald-500 hover:bg-emerald-600 text-white'}" ${lesson.completed ? 'disabled' : ''}>
          ${lesson.completed ? '✓ Completed' : 'Mark as complete'}
        </button>`;
      document.getElementById('completeBtn').addEventListener('click', async () => {
        await api.completeLesson(lesson.id);
        lesson.completed = true;
        await refreshProgress();
        selectLesson(lessonId);
      });
    } else if (lesson.content_type === 'text') {
      main.innerHTML = header + `
        <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
          <p class="text-sm text-slate-700 whitespace-pre-line">${escapeHtml(lesson.body || '')}</p>
        </div>
        <button id="completeBtn" class="px-4 py-2 rounded-md text-sm font-semibold ${lesson.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-emerald-500 hover:bg-emerald-600 text-white'}" ${lesson.completed ? 'disabled' : ''}>
          ${lesson.completed ? '✓ Completed' : 'Mark as complete'}
        </button>`;
      document.getElementById('completeBtn').addEventListener('click', async () => {
        await api.completeLesson(lesson.id);
        lesson.completed = true;
        await refreshProgress();
        selectLesson(lessonId);
      });
    } else if (lesson.content_type === 'quiz') {
      main.innerHTML = header + `
        <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
          <p class="text-sm text-slate-600 mb-4">${lesson.quiz_question_count || 0} questions · pass mark ${lesson.quiz_pass_percent || 70}%</p>
          <a href="quiz.html?lesson=${lesson.id}&course=${courseId}" class="inline-block px-4 py-2 rounded-md text-sm font-semibold bg-emerald-500 hover:bg-emerald-600 text-white">
            ${lesson.completed ? 'Retake quiz' : 'Open quiz'}
          </a>
        </div>
        ${lesson.completed ? '<p class="text-sm text-emerald-600 font-semibold">✓ Passed</p>' : ''}
        ${isOwnerOrAdmin && manageMode ? renderQuizAuthoring(lesson) : ''}
      `;
      if (isOwnerOrAdmin && manageMode) wireQuizAuthoring(lesson);
    } else if (lesson.content_type === 'assignment') {
      main.innerHTML = header + '<div class="text-slate-400 text-sm">Loading assignment…</div>';
      try {
        const { assignment, my_submission } = await api.getAssignmentForLesson(lesson.id);
        main.innerHTML = header + `
          <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
            <h3 class="font-semibold mb-2 text-sm">Instructions</h3>
            <p class="text-sm text-slate-600 whitespace-pre-line">${escapeHtml(assignment.instructions)}</p>
          </div>
          ${my_submission ? `
          <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
            <h3 class="font-semibold mb-2 text-sm">Your submission</h3>
            <p class="text-xs text-slate-400 mb-2">Submitted ${new Date(my_submission.submitted_at).toLocaleString()}</p>
            ${my_submission.submission_text ? `<p class="text-sm text-slate-700 whitespace-pre-line mb-2">${escapeHtml(my_submission.submission_text)}</p>` : ''}
            ${my_submission.submission_url ? `<a class="text-sm text-emerald-600 underline" href="${escapeHtml(my_submission.submission_url)}" target="_blank">View submitted file/link</a>` : ''}
            <div class="mt-3 text-sm">
              ${my_submission.status === 'graded'
                ? `<span class="font-semibold text-emerald-700">Graded: ${my_submission.score}/${assignment.max_score}</span>${my_submission.feedback ? ` — ${escapeHtml(my_submission.feedback)}` : ''}`
                : '<span class="text-amber-600 font-semibold">Submitted — awaiting grading</span>'}
            </div>
          </div>` : ''}
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <h3 class="font-semibold mb-3 text-sm">${my_submission ? 'Resubmit' : 'Submit your work'}</h3>
            <form id="submissionForm" class="space-y-3">
              <textarea id="subText" rows="4" placeholder="Paste your formulas, notes, or a summary of your work..." class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">${my_submission ? escapeHtml(my_submission.submission_text || '') : ''}</textarea>
              <input type="text" id="subUrl" placeholder="Link to your file (Drive/Sheets link, etc.) — optional" value="${my_submission ? escapeHtml(my_submission.submission_url || '') : ''}" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
              <button class="px-4 py-2 rounded-md text-sm font-semibold bg-emerald-500 hover:bg-emerald-600 text-white">${my_submission ? 'Resubmit' : 'Submit'}</button>
            </form>
          </div>
        `;
        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await api.submitAssignment(assignment.id, {
            submission_text: document.getElementById('subText').value.trim() || undefined,
            submission_url: document.getElementById('subUrl').value.trim() || undefined,
          });
          lesson.completed = true;
          await refreshProgress();
          selectLesson(lessonId);
        });

        if (isOwnerOrAdmin && manageMode) {
          await renderGradingQueue(assignment);
        }
      } catch (err) {
        main.innerHTML = header + `<p class="text-red-600 text-sm">Could not load assignment: ${escapeHtml(err.message)}</p>`;
      }
    }
  }

  async function renderGradingQueue(assignment) {
    const { submissions } = await api.listSubmissions(assignment.id);
    const main = document.getElementById('mainContent');
    const wrap = document.createElement('div');
    wrap.className = 'bg-amber-50 border border-amber-200 rounded-xl p-5 mt-5';
    wrap.innerHTML = `
      <h3 class="font-semibold mb-3 text-sm">Grading queue (instructor) — ${submissions.length} submission(s)</h3>
      <div class="space-y-3">
        ${submissions.length === 0 ? '<p class="text-sm text-slate-500">No submissions yet.</p>' : submissions.map((s) => `
          <div class="bg-white border border-slate-200 rounded-lg p-3">
            <div class="flex justify-between items-start text-sm">
              <div>
                <div class="font-semibold">${escapeHtml(s.student_name)}</div>
                <div class="text-xs text-slate-400">${escapeHtml(s.student_email)} · ${new Date(s.submitted_at).toLocaleString()}</div>
              </div>
              <span class="text-xs font-semibold ${s.status === 'graded' ? 'text-emerald-600' : 'text-amber-600'}">${s.status}</span>
            </div>
            ${s.submission_text ? `<p class="text-sm text-slate-600 mt-2 whitespace-pre-line">${escapeHtml(s.submission_text)}</p>` : ''}
            ${s.submission_url ? `<a class="text-sm text-emerald-600 underline" href="${escapeHtml(s.submission_url)}" target="_blank">Submitted link</a>` : ''}
            <form data-grade-form="${s.id}" class="flex gap-2 mt-3">
              <input type="number" min="0" max="${assignment.max_score}" placeholder="Score /${assignment.max_score}" value="${s.score ?? ''}" class="w-28 border border-slate-300 rounded-md px-2 py-1.5 text-sm" required>
              <input type="text" placeholder="Feedback (optional)" value="${s.feedback ? escapeHtml(s.feedback) : ''}" class="flex-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm">
              <button class="px-3 py-1.5 rounded-md bg-slate-900 hover:bg-slate-700 text-white text-xs font-semibold">Save grade</button>
            </form>
          </div>
        `).join('')}
      </div>`;
    main.appendChild(wrap);

    wrap.querySelectorAll('[data-grade-form]').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const [scoreInput, feedbackInput] = form.querySelectorAll('input');
        await api.gradeSubmission(form.dataset.gradeForm, {
          score: Number(scoreInput.value),
          feedback: feedbackInput.value.trim() || undefined,
        });
        alert('Grade saved.');
      });
    });
  }

  function renderQuizAuthoring(lesson) {
    return `
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-5">
        <h3 class="font-semibold mb-3 text-sm">Add a question (instructor)</h3>
        <form id="questionForm" class="space-y-2">
          <input type="text" id="qPrompt" placeholder="Question prompt" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          <input type="text" id="qOptA" placeholder="Option A" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          <input type="text" id="qOptB" placeholder="Option B" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          <input type="text" id="qOptC" placeholder="Option C (optional)" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          <input type="text" id="qOptD" placeholder="Option D (optional)" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          <select id="qCorrect" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
            <option value="0">Correct: A</option><option value="1">Correct: B</option>
            <option value="2">Correct: C</option><option value="3">Correct: D</option>
          </select>
          <textarea id="qExplain" placeholder="Explanation shown after answering" rows="2" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></textarea>
          <button class="w-full bg-slate-900 hover:bg-slate-700 text-white rounded-md py-2 text-sm font-semibold">Add question</button>
        </form>
      </div>`;
  }

  function wireQuizAuthoring(lesson) {
    document.getElementById('questionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const options = [
        document.getElementById('qOptA').value.trim(),
        document.getElementById('qOptB').value.trim(),
        document.getElementById('qOptC').value.trim(),
        document.getElementById('qOptD').value.trim(),
      ].filter(Boolean);
      await api.addQuestion(lesson.quiz_id, {
        prompt: document.getElementById('qPrompt').value.trim(),
        options,
        correct_index: Number(document.getElementById('qCorrect').value),
        explanation: document.getElementById('qExplain').value.trim() || undefined,
      });
      lesson.quiz_question_count = (lesson.quiz_question_count || 0) + 1;
      alert('Question added.');
      selectLesson(lesson.id);
    });
  }

  // ---- Authoring: modules & lessons ----
  function openLessonModal(moduleId) {
    document.getElementById('lessonModuleId').value = moduleId;
    document.getElementById('lessonForm').reset();
    updateLessonFieldVisibility();
    openModal(document.getElementById('lessonModal'));
  }
  function updateLessonFieldVisibility() {
    const type = document.getElementById('lessonType').value;
    document.getElementById('fieldVideoUrl').classList.toggle('hidden', type !== 'video');
    document.getElementById('fieldInstructions').classList.toggle('hidden', type !== 'assignment');
    document.getElementById('fieldPassPercent').classList.toggle('hidden', type !== 'quiz');
    document.getElementById('bodyLabel').textContent = type === 'video' ? 'Notes (shown under the video)' : 'Body';
  }
  document.getElementById('lessonType').addEventListener('change', updateLessonFieldVisibility);

  document.getElementById('addModuleBtn').addEventListener('click', () => openModal(document.getElementById('moduleModal')));

  document.getElementById('moduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await api.addModule(courseId, { title: document.getElementById('moduleTitle').value.trim() });
    closeModal(document.getElementById('moduleModal'));
    document.getElementById('moduleForm').reset();
    await loadCourse();
  });

  document.getElementById('lessonForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('lessonError');
    errEl.classList.add('hidden');
    const type = document.getElementById('lessonType').value;
    try {
      await api.addLesson(document.getElementById('lessonModuleId').value, {
        title: document.getElementById('lessonTitle').value.trim(),
        content_type: type,
        video_url: type === 'video' ? document.getElementById('lessonVideoUrl').value.trim() : undefined,
        body: document.getElementById('lessonBody').value.trim() || undefined,
        duration_minutes: document.getElementById('lessonDuration').value ? Number(document.getElementById('lessonDuration').value) : undefined,
        instructions: type === 'assignment' ? document.getElementById('lessonInstructions').value.trim() : undefined,
        pass_percent: type === 'quiz' ? Number(document.getElementById('lessonPassPercent').value) : undefined,
      });
      closeModal(document.getElementById('lessonModal'));
      await loadCourse();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });

  async function loadCourse() {
    const { course: c } = await api.getCourse(courseId);
    course = c;
    isOwnerOrAdmin = user.role === 'admin' || course.instructor_id === user.id;
    renderSidebar();
    await refreshProgress();
    const firstLesson = course.modules.flatMap((m) => m.lessons)[0];
    if (firstLesson) selectLesson(currentLessonId || firstLesson.id);
    else document.getElementById('mainContent').innerHTML = '<p class="text-slate-400 text-sm">This course has no lessons yet.</p>';
  }

  loadCourse().catch((err) => {
    console.error(err);
    document.getElementById('mainContent').innerHTML = `<p class="text-red-600">Could not load course: ${escapeHtml(err.message)}</p>`;
  });
</script>
</body>
</html>
