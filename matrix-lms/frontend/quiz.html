<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Matrix LMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<nav class="bg-slate-900 text-white no-print">
  <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="font-bold text-lg tracking-tight">Matrix <span class="text-emerald-400">LMS</span></div>
    <a id="backLink" href="dashboard.html" class="text-sm px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700">← Back to course</a>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-6 py-10">
  <div id="quizHeader" class="mb-6">
    <h1 id="quizTitle" class="text-2xl font-bold text-slate-900"></h1>
    <p id="quizMeta" class="text-sm text-slate-500 mt-1"></p>
  </div>

  <div id="scoreBanner" class="hidden mb-6"></div>

  <form id="quizForm" class="space-y-6"></form>

  <div class="mt-6 flex gap-3">
    <button id="submitBtn" class="px-5 py-2.5 rounded-md bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm">Submit Quiz</button>
    <button id="retryBtn" class="hidden px-5 py-2.5 rounded-md bg-slate-900 hover:bg-slate-700 text-white font-semibold text-sm">Retry</button>
  </div>
</main>

<script type="module">
  import { api, requireAuth, escapeHtml, qs } from './js/api.js';

  requireAuth();
  const lessonId = qs('lesson');
  const courseId = qs('course');
  if (!lessonId || !courseId) window.location.href = 'dashboard.html';
  document.getElementById('backLink').href = `course-viewer.html?course=${courseId}`;

  let quiz = null;
  let graded = false;

  function renderQuestions(results) {
    const form = document.getElementById('quizForm');
    form.innerHTML = quiz.questions.map((q, qi) => {
      const result = results ? results.find((r) => r.question_id === q.id) : null;
      return `
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="font-semibold text-sm mb-3">${qi + 1}. ${escapeHtml(q.prompt)}</div>
          ${q.options.map((opt, oi) => {
            let cls = 'border-slate-200';
            if (result) {
              if (oi === result.correct_index) cls = 'border-emerald-400 bg-emerald-50';
              else if (oi === result.chosen_index) cls = 'border-red-300 bg-red-50';
            }
            return `
              <label class="flex items-start gap-2 border ${cls} rounded-md px-3 py-2 mb-2 text-sm cursor-pointer">
                <input type="radio" name="q_${q.id}" value="${oi}" ${result ? 'disabled' : ''} ${result && oi === result.chosen_index ? 'checked' : ''} class="mt-0.5">
                <span>${escapeHtml(opt)}</span>
              </label>`;
          }).join('')}
          ${result ? `<p class="text-xs text-slate-500 mt-2 bg-slate-50 rounded-md p-2">${escapeHtml(result.explanation || '')}</p>` : ''}
        </div>`;
    }).join('');
  }

  async function loadQuiz() {
    const { quiz: q } = await api.getQuizForLesson(lessonId);
    quiz = q;
    document.getElementById('quizTitle').textContent = quiz.title;
    document.getElementById('quizMeta').textContent = `${quiz.questions.length} questions · pass mark ${quiz.pass_percent}%`;
    renderQuestions(null);
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const answers = {};
    let allAnswered = true;
    quiz.questions.forEach((q) => {
      const picked = document.querySelector(`input[name="q_${q.id}"]:checked`);
      if (!picked) { allAnswered = false; return; }
      answers[q.id] = Number(picked.value);
    });
    if (!allAnswered) { alert('Please answer every question before submitting.'); return; }

    const result = await api.submitQuizAttempt(quiz.id, answers);
    graded = true;
    renderQuestions(result.results);

    const banner = document.getElementById('scoreBanner');
    banner.classList.remove('hidden');
    banner.innerHTML = `
      <div class="rounded-xl p-5 text-center ${result.passed ? 'bg-emerald-50' : 'bg-amber-50'}">
        <div class="text-3xl font-extrabold text-slate-900">${result.score_percent}%</div>
        <div class="text-sm text-slate-600 mt-1">${result.passed ? 'You passed! Lesson marked complete.' : `Needed ${result.pass_percent}% to pass — try again.`}</div>
        ${result.certificate_issued ? '<div class="text-sm font-semibold text-emerald-700 mt-2">🎓 Course complete — certificate issued! Check your dashboard.</div>' : ''}
      </div>`;

    document.getElementById('submitBtn').classList.add('hidden');
    if (!result.passed) document.getElementById('retryBtn').classList.remove('hidden');
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    graded = false;
    document.getElementById('scoreBanner').classList.add('hidden');
    document.getElementById('submitBtn').classList.remove('hidden');
    document.getElementById('retryBtn').classList.add('hidden');
    renderQuestions(null);
  });

  loadQuiz().catch((err) => {
    document.getElementById('quizForm').innerHTML = `<p class="text-red-600 text-sm">Could not load quiz: ${escapeHtml(err.message)}</p>`;
    document.getElementById('submitBtn').classList.add('hidden');
  });
</script>
</body>
</html>
